[project]
name = "world-adapt"
version = "0.1.0"
description = "Benchmark for agent adaptation to imperfect predictive tools"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.1.0",
    "gym-pusht==0.1.6",
    "numpy",
    "openai>=1.40",
    "pillow",
    "pymunk==6.11.1",
    "pyperplan==2.1",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["world_adapt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
